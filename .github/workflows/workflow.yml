name: CI workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project deps if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure test/lint tools exist
          pip install pytest flake8

      - name: Lint (flake8)
        # Use --exit-zero so lint warnings don't fail the build in this lab
        run: flake8 . --exit-zero

      - name: Run tests
        run: pytest -q

